name: exchange_caclculator
description: A Esteban Ariel Farias Generated Exchange Caclculator.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  auto_size_text: ^3.0.0
  dartz: ^0.10.1
  dio: ^5.11.1
  easy_debounce: ^2.0.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^17.2.3
  injectable: ^2.7.1+4
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.8.0
  package_info_plus: ^9.0.1
  pretty_dio_logger: ^1.4.0
  retrofit: 4.9.1
  shimmer: ^3.0.0
  top_snackbar_flutter: ^3.4.0
  url_launcher: ^6.3.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.7.1
  flutter_gen_runner: 5.12.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  injectable_generator: ^2.8.1
  json_serializable: ^6.11.2
  mockito: ^5.5.0
  retrofit_generator: 10.2.0
  very_good_analysis: ^10.0.0

flutter_gen:
  integrations:
    flutter_svg: true
    lottie: true
    rive: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/splash/app_icon.png
  adaptive_icon_background: "#FFFD3F"
  adaptive_icon_foreground: assets/splash/app_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFD3F"
  image: assets/splash/app_icon.png
  android: true
  # iOS launch screen is managed manually (SplashIcon) to avoid VGV cache/name collisions.
  ios: false
  web: false
  android_12:
    color: "#FFFD3F"
    image: assets/splash/app_icon.png
    icon_background_color: "#FFFD3F"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/fiat_currencies/
    - assets/cripto_currencies/
    - assets/splash/
    - assets/mock/
   

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Black.ttf
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
        - asset: assets/fonts/poppins/Poppins-ExtraLight.ttf
        - asset: assets/fonts/poppins/Poppins-Light.ttf
        - asset: assets/fonts/poppins/Poppins-LightItalic.ttf
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
