name: exchange_caclculator
description: A Esteban Ariel Farias Generated Exchange Caclculator.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  auto_size_text: ^3.0.0
  dartz: ^0.10.1
  dio: ^5.11.1
  easy_debounce: ^2.0.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^17.2.3
  injectable: ^2.7.1+4
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.8.0
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.10.0
  shimmer: ^3.0.0
  top_snackbar_flutter: ^3.4.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.7.1
  flutter_gen_runner: ^5.14.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  injectable_generator: ^2.8.1
  json_serializable: ^6.11.2
  mockito: ^5.5.0
  retrofit_generator: ^10.2.0
  very_good_analysis: ^10.0.0

flutter_gen:
  integrations:
    flutter_svg: true
    lottie: true
    rive: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/fiat_currencies/
    - assets/cripto_currencies/
   

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Black.ttf
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
        - asset: assets/fonts/poppins/Poppins-ExtraLight.ttf
        - asset: assets/fonts/poppins/Poppins-Light.ttf
        - asset: assets/fonts/poppins/Poppins-LightItalic.ttf
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
